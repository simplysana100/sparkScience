<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>ScienceLab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff;--ink:#0b2545;--mut:#4d6178;--card:#fff;--line:#d9e3ee;--soft:#eef5fc;--b1:#1d6fd8;--b2:#0a8379;--warn:#b45309;--ok:#0a7a4b;--glow:#f5b301;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1522;--ink:#e8f0fa;--mut:#9fb2c8;--card:#111f31;--line:#26384f;--soft:#14263b;--b1:#2a6fd0;--b2:#0b8f84;--warn:#f0b35a;--ok:#4cd39a}}
:root[data-theme="dark"]{--bg:#0b1522;--ink:#e8f0fa;--mut:#9fb2c8;--card:#111f31;--line:#26384f;--soft:#14263b;--b1:#2a6fd0;--b2:#0b8f84;--warn:#f0b35a;--ok:#4cd39a}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}h1,h2,h3{line-height:1.2;margin:0 0 .5rem}h1{font-size:clamp(1.7rem,4vw,2.4rem)}h2{font-size:1.3rem}h3{font-size:1.05rem}p{margin:.3rem 0 .8rem}.mut{color:var(--mut)}
header{display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;align-items:center;padding:.7rem 1.2rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-weight:800;font-size:1.25rem;text-decoration:none;display:flex;flex-direction:column;line-height:1.1}.logo small{font-weight:400;font-size:.72rem;color:var(--mut)}
nav{display:flex;gap:.2rem;overflow-x:auto;flex:1}nav a{padding:.45rem .8rem;border-radius:99px;text-decoration:none;color:var(--mut);white-space:nowrap}nav a.on{background:var(--soft);color:var(--ink);font-weight:700;box-shadow:inset 0 -2px var(--b2)}
main{max-width:1100px;margin:0 auto;padding:1.2rem;overflow-x:hidden}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:.6rem 1rem;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block;min-height:44px}
.btn.p{background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;border:0}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.sm{min-height:36px;padding:.3rem .7rem}
:focus-visible{outline:3px solid var(--b1);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem;box-shadow:0 1px 3px rgba(11,37,69,.07)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.hero{background:linear-gradient(135deg,var(--soft),transparent);border:1px solid var(--line);border-radius:20px;padding:1.6rem;margin-bottom:1.4rem}
.tag{display:inline-block;font-size:.8rem;padding:.1rem .55rem;border-radius:99px;background:var(--soft);border:1px solid var(--line);margin-right:.3rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem}.stats b{font-size:1.7rem;display:block}
section{margin:1.6rem 0}.lab{display:grid;gap:1rem}@media(min-width:900px){.lab{grid-template-columns:3fr 2fr}}
svg.ws{width:100%;height:auto;background:var(--soft);border:1px solid var(--line);border-radius:14px;touch-action:none;display:block}
.ws text{fill:var(--ink);font:13px system-ui,sans-serif}.body{fill:var(--card);stroke:var(--ink);stroke-width:2.5}.ln{stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round}
.wire{stroke:var(--mut);stroke-width:4;fill:none;stroke-linecap:round}.wire.live{stroke:var(--b2)}.hit{stroke:transparent;stroke-width:16;fill:none;cursor:pointer}
.term{fill:var(--card);stroke:var(--ink);stroke-width:2.5;cursor:pointer}.term.c{fill:var(--b2)}.term.s{stroke:var(--warn);stroke-width:5}
.glow{fill:var(--glow);opacity:.45;animation:p .5s ease-out}@keyframes p{from{opacity:0;transform:scale(.6)}}@media(prefers-reduced-motion:reduce){.glow{animation:none}}
.status{padding:.7rem 1rem;border-radius:12px;font-weight:700;border:2px solid}.status.ok{color:var(--ok);border-color:var(--ok)}.status.no{color:var(--warn);border-color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:.9rem;display:block;overflow-x:auto}th,td{border-bottom:1px solid var(--line);padding:.4rem .5rem;text-align:left;white-space:nowrap}
select,input[type=search],textarea{font:inherit;padding:.5rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:44px;max-width:100%}
label.o{display:block;padding:.5rem;border:1px solid var(--line);border-radius:10px;margin:.3rem 0;cursor:pointer}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;z-index:9;max-width:90vw}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20;padding:1rem}.dlg>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.2rem;max-width:380px}
ul.t{list-style:none;padding:0;margin:0}ul.t li{padding:.35rem 0}
</style></head><body>
<header><a class="logo" href="#/" aria-label="ScienceLab home">ScienceLab<small>Explore. Experiment. Discover.</small></a>
<nav aria-label="Main"><a href="#/" data-r="">Dashboard</a><a href="#/library" data-r="library">Experiment Library</a><a href="#/saved" data-r="saved">Saved Experiments</a><a href="#/reports" data-r="reports">Lab Reports</a><a href="#/progress" data-r="progress">My Progress</a><a href="#/about" data-r="about">About</a></nav>
<a class="btn p sm" href="#/circuit">Start Experimenting</a></header>
<main id="app" tabindex="-1"></main><div id="toast" class="toast" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s),K='sciencelab.v1';
const L=[{id:'circuit',n:'Electric Circuit Builder',s:'Physics',lv:'Beginner',dl:'Beginner to Intermediate',d:'Build virtual circuits and discover how electricity flows.',m:15,ok:1},
{id:'plant',n:'Plant Growth Lab',s:'Biology',lv:'Beginner',dl:'Beginner',d:'Investigate how sunlight, water and temperature affect plant growth.',m:15},
{id:'float',n:'Float or Sink Lab',s:'Physics',lv:'Beginner',dl:'Beginner',d:'Explore density and buoyancy by testing virtual objects in water.',m:10},
{id:'magnet',n:'Magnetism Lab',s:'Physics',lv:'Intermediate',dl:'Beginner to Intermediate',d:'Explore magnets, poles and fields: what attracts, what repels, and why distance matters.',m:15}];
const DQ=[{q:'What does a complete electric circuit need?',a:['A closed loop with a power source','Only a bulb','Only wires'],c:0,e:'Current flows only around a complete, closed loop that includes a power source.'},
{q:'Which gas do plants take in for photosynthesis?',a:['Oxygen','Carbon dioxide','Nitrogen'],c:1,e:'Plants use carbon dioxide, water and light to make sugars.'},
{q:'An object floats in water if its density is…',a:['More than 1 g/cm³','Exactly 5 g/cm³','Less than 1 g/cm³'],c:2,e:'Water’s density is about 1 g/cm³, so less dense objects float.'}];
const fresh=()=>({v:1,started:{},last:null,daily:{},saves:[],done:{},reports:[],c:initC()});
const initC=()=>({n:4,comps:[{id:'b1',t:'battery',x:130,y:80},{id:'l1',t:'bulb',x:340,y:80},{id:'s1',t:'switch',x:235,y:250,open:false}],wires:[],obs:[],tasks:{},pred:null});
let S=(()=>{try{const d=JSON.parse(localStorage.getItem(K));if((d=>{if(!(d&&d.v===1&&d.c&&Array.isArray(d.c.comps)&&Array.isArray(d.c.wires)&&Array.isArray(d.c.obs)&&d.c.tasks&&typeof d.c.tasks=='object'&&Array.isArray(d.saves)&&Array.isArray(d.reports)))return 0;const o=x=>x&&typeof x=='object'&&!Array.isArray(x);if(!['started','done','daily'].every(k=>o(d[k])))return 0;if(d.p&&!(Array.isArray(d.p.log)&&o(d.p.s)&&o(d.p.tasks)))delete d.p;if(d.f&&!(Array.isArray(d.f.log)&&o(d.f.tasks)))delete d.f;if(d.m&&!(Array.isArray(d.m.log)&&o(d.m.tasks)&&o(d.m.pr)))delete d.m;if(d.q&&!o(d.q))delete d.q;if(d.days&&!Array.isArray(d.days))delete d.days;if(d.facts&&!Array.isArray(d.facts))delete d.facts;if(d.td&&!(o(d.td)&&Array.isArray(d.td.a)))delete d.td;d.reports=d.reports.filter(r=>r&&typeof r.id=='string'&&r.d&&['rows','proc','head','objectives','pred','vars','missions'].every(k=>Array.isArray(r.d[k]))&&(!r.d.graph||Array.isArray(r.d.graph.log)));const v=s=>s&&typeof s=='object'&&(s.c?(Array.isArray(s.c.comps)&&Array.isArray(s.c.wires)&&Array.isArray(s.c.obs)&&o(s.c.tasks)):s.p?(Array.isArray(s.p.log)&&o(s.p.s)&&o(s.p.tasks)):s.f?(Array.isArray(s.f.log)&&o(s.f.tasks)):s.m?(Array.isArray(s.m.log)&&o(s.m.tasks)&&o(s.m.pr)):false);d.saves=d.saves.filter(v);return 1})(d))return d}catch(e){}return fresh()})();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let sel=null,tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3000)};
const status=id=>S.done[id]?'Completed':S.started[id]?'In progress':'Not started';
const ill=k=>({circuit:'<rect x="14" y="30" width="30" height="20" rx="3" fill="#1d6fd8"/><path d="M44 40h20M96 40h14M110 40v20H14V40" stroke="#0b2545" stroke-width="3" fill="none"/><circle cx="80" cy="40" r="16" fill="#f5b301" opacity=".8"/>',
plant:'<path d="M60 70V30" stroke="#0a8379" stroke-width="4"/><ellipse cx="46" cy="38" rx="14" ry="7" fill="#2fa86b" transform="rotate(-30 46 38)"/><ellipse cx="74" cy="30" rx="14" ry="7" fill="#2fa86b" transform="rotate(30 74 30)"/><rect x="42" y="68" width="36" height="10" fill="#b8793e"/>',
float:'<rect x="10" y="34" width="100" height="40" rx="6" fill="#8cc4f5"/><rect x="36" y="26" width="24" height="16" fill="#b8793e"/><circle cx="84" cy="62" r="8" fill="#5b6b7d"/>',
magnet:'<path d="M30 66V38a22 22 0 0 1 44 0V66" fill="none" stroke="#d33" stroke-width="12"/><rect x="24" y="58" width="12" height="10" fill="#ccd"/><rect x="68" y="58" width="12" height="10" fill="#ccd"/>',light:'<path d="M8 20L56 44" stroke="#f5b301" stroke-width="3"/><path d="M60 24l22 40H38z" fill="none" stroke="#0b2545" stroke-width="3"/><path d="M62 42l44-10M62 46l46 4M62 50l44 16" stroke="#1d6fd8" stroke-width="2"/>'}[k]);
const svg=k=>`<svg viewBox="0 0 120 80" width="100%" height="80" role="img" aria-label="${k} illustration" style="background:var(--soft);border-radius:10px">${ill(k)}</svg>`;
const unl=l=>{const i=L.indexOf(l);return i==0||!!S.done[L[i-1].id]};const lockBtn=l=>unl(l)?`<a class="btn p" href="#/${l.id}">Open Experiment</a>`:`<button class="btn" disabled>🔒 Complete ${L[L.indexOf(l)-1].n} to unlock</button>`;
const labCard=l=>`<article class="card">${svg(l.id)}<h3 style="margin-top:.6rem">${l.n}</h3><p><span class="tag">${l.s}</span><span class="tag">${l.dl}</span><span class="tag">${status(l.id)}</span></p><p class="mut">${l.d} (~${l.m} min)</p>${lockBtn(l)}</article>`;
const stats=()=>{const n=k=>Object.keys(k).length,ch=qa()+Object.keys(S.c.tasks).length+(S.p?Object.keys(S.p.tasks).length:0)+(S.f?Object.keys(S.f.tasks).length:0)+(S.m?Object.keys(S.m.tasks).length:0)+n(S.daily);return `<div class="stats"><div class="card"><b>${n(S.started)}</b>Experiments started</div><div class="card"><b>${n(S.done)}</b>Experiments completed</div><div class="card"><b>${ch}</b>Challenges answered</div><div class="card"><b>${S.reports.length}</b>Lab reports saved</div></div>`};
function daily(){const k=new Date().toISOString().slice(0,10),q=DQ[Math.floor(Date.now()/864e5)%DQ.length],a=S.daily[k];return `<div class="card" id="dq"><h2>Daily Science Question</h2><p>${q.q}</p><form>${q.a.map((x,i)=>`<label class="o"><input type="radio" name="dq" value="${i}" ${a&&a.v==i?'checked':''}> ${x}</label>`).join('')}<button class="btn p" data-act="dq" type="button">Check Answer</button></form><p id="dqf" role="status">${a?(a.v==q.c?'✔ Correct. ':'✘ Not quite. ')+q.e:''}</p></div>`}
const V={
'':()=>{const l=L.find(x=>x.id===S.last);return `<div class="hero"><h1>Welcome to ScienceLab!</h1><p class="mut">Ask questions, test your ideas and discover the science behind everyday things.</p><div class="row"><a class="btn p" href="#/circuit">Start Experimenting</a><a class="btn" href="#/library">Explore All Labs</a></div></div>
<section><h2>Continue Learning</h2>${l?`<div class="card row"><div><h3>${l.n}</h3><span class="mut">${status(l.id)}</span></div><a class="btn p" href="#/${l.id}">Continue</a></div>`:'<div class="card">You haven’t started an experiment yet. Open the Electric Circuit Builder to begin.</div>'}</section>
<section><h2>Featured Experiments</h2><div class="grid">${L.filter(x=>!S.done[x.id]).map(labCard).join('')||'<div class="card">All available labs are completed. 🎉</div>'}</div></section><section><h2>Completed</h2><div class="grid">${L.filter(x=>S.done[x.id]).map(labCard).join('')||'<div class="card">Labs you mark complete will appear here.</div>'}</div></section><section><h2>Your Progress</h2>${stats()}</section><section>${daily()}</section>`},
library:()=>`<h1>Experiment Library</h1><div class="row" role="search"><input type="search" id="q" placeholder="Search experiments" aria-label="Search experiments"><select id="fs" aria-label="Subject"><option value="">All subjects</option><option>Physics</option><option>Biology</option></select><select id="fd" aria-label="Difficulty"><option value="">All difficulties</option><option>Beginner</option><option>Intermediate</option></select><select id="fc" aria-label="Status"><option value="">Any status</option><option>Not started</option><option>In progress</option><option>Completed</option></select></div><div class="grid" id="lib" style="margin-top:1rem"></div>`,
progress:()=>`<h1>My Progress</h1>${stats()}<section><h2>Experiments</h2><ul class="t">${L.map(l=>`<li><b>${l.n}</b>: ${status(l.id)}</li>`).join('')}</ul></section><section><h2>Saved Experiments</h2>${S.saves.length?S.saves.map((s,i)=>`<div class="card row" style="margin:.5rem 0"><div style="flex:1"><b>${s.m||s.l?L[3].n:s.f?L[2].n:s.p?L[1].n:L[0].n}</b><br><span class="mut">${s.when} · ${s.obs} observations</span></div><button class="btn sm" data-act="open" data-i="${i}">Reopen</button><button class="btn sm" data-act="del" data-i="${i}">Delete</button></div>`).join(''):'<div class="card">No saved experiments yet. Use “Save Experiment” inside a lab.</div>'}</section><button class="btn" data-act="resetall">Reset My Progress</button>`,
about:()=>`<h1>About ScienceLab</h1><div class="card"><p>ScienceLab is an interactive virtual science laboratory for students aged about 10–17. Instead of only reading explanations, students change variables, make predictions, observe outcomes and record evidence.</p><p>Predicting first makes students commit to an idea; comparing it with what actually happens is how scientific understanding grows.</p><p>The simulations are simplified educational models, not exact representations of real equipment. ScienceLab works without an account and stores progress only in your browser.</p></div>`,
circuit:()=>{S.started.circuit=1;S.last='circuit';save();return `<a href="#/library">← Back to library</a><h1>Electric Circuit Builder <span class="tag">Physics</span></h1><p class="mut">Build a circuit, then test what a battery, bulbs and a switch do.</p>
<div class="card"><h3>Learning objectives</h3><ul><li>A bulb lights only when part of a complete loop with a battery.</li><li>An open switch or loose wire breaks the loop.</li><li>Compare one bulb with two bulbs in series.</li></ul></div>
<div class="lab" style="margin-top:1rem"><div><div class="row" style="margin-bottom:.6rem"><button class="btn sm" data-act="add" data-t="battery">+ Battery</button><button class="btn sm" data-act="add" data-t="bulb">+ Bulb</button><button class="btn sm" data-act="add" data-t="switch">+ Switch</button><button class="btn sm" data-act="example">Build example</button><button class="btn sm" data-act="reset">Reset</button></div>
<svg class="ws" id="ws" viewBox="0 0 520 330" role="img" aria-label="Circuit workspace"></svg><p class="mut" style="font-size:.9rem">Click a terminal (circle), then another terminal to wire them. Click a wire to remove it. Click a switch to open/close it. Drag parts to move them; × removes a part.</p><div id="st"></div></div>
<div><div class="card"><h3>Predict</h3><p>If you open the switch in your lit circuit, what will happen to the bulb?</p><label class="o"><input type="radio" name="pr" value="lit"> It stays lit</label><label class="o"><input type="radio" name="pr" value="out"> It goes out</label><button class="btn p" data-act="pred">Test my prediction</button><p id="pr" role="status"></p></div>
<div class="card" style="margin-top:1rem"><h3>Challenges</h3><ul class="t" id="tk"></ul><button class="btn p" id="cm" data-act="complete">Mark experiment complete</button></div></div></div>
<section class="card"><h2>Observations</h2><div class="row"><button class="btn sm" data-act="rec">Record observation</button><button class="btn sm" data-act="clr">Clear observations</button><button class="btn sm" data-act="save">Save Experiment</button></div><table><thead><tr><th>#</th><th>Circuit</th><th>Switch</th><th>Bulbs</th><th>Complete?</th><th>Bulbs lit</th></tr></thead><tbody id="ob"></tbody></table></section>
<section class="card"><h2>Explanation</h2><p>Electric current flows only around a closed loop. The battery pushes charge through wires and bulbs; an open switch or unconnected wire leaves a gap, so the current stops and bulbs go out. In a series loop, bulbs share the battery’s voltage, so each glows with less of it.</p><p class="mut">Simplified model: one 3 V cell, 10 Ω bulbs, ideal wires and switches.</p></section>`}};
const comp=id=>S.c.comps.find(k=>k.id===id),P=t=>{const k=comp(t.split('.')[0]);return[k.x+(t.endsWith('a')?-34:34),k.y]};
function sim(c,force){const par={},f=x=>{if(!(x in par))par[x]=x;while(par[x]!==x){par[x]=par[par[x]];x=par[x]}return x};c.wires.forEach(([a,b])=>par[f(a)]=f(b));
const bats=c.comps.filter(k=>k.t=='battery'),bulbs=c.comps.filter(k=>k.t=='bulb'),sws=c.comps.filter(k=>k.t=='switch');
const E=[...bulbs.map(k=>({id:k.id,u:f(k.id+'.a'),v:f(k.id+'.b')})),...sws.filter(k=>force||!k.open).map(k=>({id:k.id,u:f(k.id+'.a'),v:f(k.id+'.b')}))];
const reach=(a,b,skip)=>{const seen=new Set([a]),q=[a];while(q.length){const n=q.shift();if(n===b)return true;E.forEach(e=>{if(e.id===skip)return;const o=e.u===n?e.v:e.v===n?e.u:null;if(o!==null&&!seen.has(o)){seen.add(o);q.push(o)}})}return false};
let complete=false,short=false;const ends=bats.map(b=>[f(b.id+'.b'),f(b.id+'.a')]);
ends.forEach(([s,e])=>{if(s===e)short=true;else if(reach(s,e))complete=true});
const lit=bulbs.filter(b=>{const u=f(b.id+'.a'),v=f(b.id+'.b');return u!==v&&ends.some(([s,e])=>s!==e&&((reach(s,u,b.id)&&reach(v,e,b.id))||(reach(s,v,b.id)&&reach(u,e,b.id))))}).map(b=>b.id);
const cnt={};c.comps.forEach(k=>['a','b'].forEach(x=>{const n=f(k.id+'.'+x);cnt[n]=(cnt[n]||0)+1}));
const series=complete&&!short&&bats.length==1&&bulbs.length>0&&lit.length==bulbs.length&&c.wires.length>0&&Object.values(cnt).every(v=>v==2);
return{lit,complete:complete&&!short,short,series,bats:bats.length,bulbs:bulbs.length,sw:sws.length,I:series?3/(10*bulbs.length):null,f}}
const TASKS=[['t1','Build a working circuit with one bulb'],['t2','Open the switch and see the bulb go out'],['t3','Add a second bulb and light both']];
function check(){const c=S.c,r=sim(c),a=sim(c,true),o=c.comps.some(k=>k.t=='switch'&&k.open);let n=0;
if(r.lit.length==1&&r.bulbs==1)c.tasks.t1=1;if(o&&r.lit.length==0&&a.lit.length>0)c.tasks.t2=1;if(r.bulbs>=2&&r.lit.length>=2)c.tasks.t3=1;
const k=Object.keys(c.tasks).length;if(k>(check.n||0)&&check.n!==undefined)toast('Challenge complete!');check.n=k}
function draw(){const c=S.c,r=sim(c),conn=new Set(c.wires.flat());let h='';
c.wires.forEach(([a,b],i)=>{const[x1,y1]=P(a),[x2,y2]=P(b),d=`M${x1} ${y1}Q${(x1+x2)/2} ${Math.max(y1,y2)+40} ${x2} ${y2}`;h+=`<g data-w="${i}" tabindex="0" role="button" aria-label="Remove wire"><title>Click to remove wire</title><path class="wire ${r.complete?'live':''}" d="${d}"/><path class="hit" d="${d}"/></g>`});
c.comps.forEach(k=>{const{x,y}=k;let b='';

<section class='card'><h2>Why does this happen?</h2><p>Light travels slower in water and glass than in air. When a ray enters a slower material at an angle, one side slows first and the ray turns toward the normal. Snell’s law, n₁ sin θ₁ = n₂ sin θ₂, gives the exact angle. Going from glass or water into air, the ray bends away from the normal, and past the critical angle it cannot escape at all: that is total internal reflection.</p><p>In a prism, each colour has a slightly different refractive index, so violet bends more than red and white light spreads into a spectrum.</p><p class='mut'>Simplified model: air n = 1.00, water 1.33, glass 1.52; the prism has a 60° apex angle and an educational set of colour indices (about 1.61 for red to 1.65 for violet). Real values vary a little.</p></section>`};
